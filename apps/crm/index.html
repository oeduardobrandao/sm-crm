<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Mesaas — CRM para agências e gestores de social media</title>
    <meta name="description" content="CRM para social media: clientes, aprovação de posts por link, agendamento automático no Instagram, relatórios e financeiro em um só lugar. Comece grátis." />
    <meta name="theme-color" content="#12151a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#12151a" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" href="/mesaas-icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Apply dark theme before React hydrates to avoid flash -->
    <script>
      (function() {
        const hash = window.location.hash;
        if (hash === '#/' || hash === '#/login') return;
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Non-blocking: the stack falls back to SF Pro/system-ui, so the swap is cosmetic. -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"></noscript>
    <!-- Pinned (an unpinned URL 302s to whatever is latest) + SRI. The script only injects the
         jsdelivr stylesheets for the same pinned version; bump the version and the hash together. -->
    <script defer src="https://unpkg.com/@phosphor-icons/web@2.1.2/src/index.js" integrity="sha384-J7cw2fbG1T4C5MirTVUxsZGaMfw2m0XsCgOQEqUvB1OF9VIsHWuZF1GmyVRzs7eu" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/style.css">
    <!-- style.css hides #lp-ssr (the landing page's prerendered crawler/SEO
         mirror) by default so it never flashes before React mounts. Without
         JS there's no mount to replace it, so force it back on — readable,
         not blank. -->
    <noscript><style>#lp-ssr { display: block !important; }</style></noscript>
    <!-- Crisp: only the $crisp queue and the website id live here. The widget script is injected
         by lib/crispLoader.ts after the visitor consents to the support category. $crisp queues
         calls immediately, so every window.$crisp.push in the app is harmless until then. -->
    <script type="text/javascript">window.$crisp=[];window.CRISP_WEBSITE_ID="bc54b5a7-dc07-46a9-8b6a-1c3ba9923314";</script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Fallback for a bundle that fails to download, is blocked, or throws
      // before createRoot() ever runs (the <noscript> rule above only fires
      // when scripting itself is off, not when JS is enabled but broken):
      // reveal the prerendered #lp-ssr mirror instead of leaving the page
      // blank forever. A successful mount already replaces #root's content
      // — #lp-ssr included — well before this fires, so it's a no-op on
      // every normal load.
      setTimeout(function () {
        var el = document.getElementById('lp-ssr');
        if (el) el.style.display = 'block';
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
