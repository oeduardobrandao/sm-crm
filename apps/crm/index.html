<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Mesaas — CRM para agências e gestores de social media</title>
    <meta name="description" content="CRM para social media: clientes, aprovação de posts por link, agendamento automático no Instagram, relatórios e financeiro em um só lugar. Comece grátis." />
    <meta name="theme-color" content="#12151a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#12151a" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" href="/mesaas-icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Apply dark theme before React hydrates to avoid flash -->
    <script>
      (function() {
        const hash = window.location.hash;
        if (hash === '#/' || hash === '#/login') return;
        try {
          if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
        // Desktop "Vidro" look (src/lib/vidroLook.ts): look-vidro holds the user id it was
        // resolved for; pre-paint only when the stored Supabase session is that user's.
        try {
          var lookUser = localStorage.getItem('look-vidro');
          if (lookUser) {
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (k && /^sb-[a-z0-9]+-auth-token$/.test(k)) {
                var sess = JSON.parse(localStorage.getItem(k) || 'null');
                if (sess && sess.user && sess.user.id === lookUser) {
                  document.documentElement.setAttribute('data-look', 'vidro');
                  break;
                }
              }
            }
          }
        } catch (e) {}
      })();
      // iOS home-screen web app (style.css: html[data-standalone]). Set before first paint.
      if (window.navigator.standalone === true) {
        document.documentElement.setAttribute('data-standalone', '');
        // iOS opens the home-screen app with the web view measured as if it ended at the
        // status bar's height above the bottom (812 of 874pt on a 402x874 iPhone), and only
        // re-measures when a scroll comes back to the top: until then fixed layers, the tab
        // bar included, stop 62pt short of the bottom. The re-measure takes the smaller of
        // the screen and the document, so stretch the document to the screen, scroll 1px
        // and back, then let it go. Portrait only: iOS's screen.height does not rotate, so
        // in landscape innerHeight is always below it.
        (function () {
          var root = document.documentElement;
          var tries = 0;
          function short() {
            return window.innerWidth === screen.width && window.innerHeight < screen.height;
          }
          function nudge() {
            if (!short() || tries++ >= 3) return;
            root.style.minHeight = screen.height + 1 + 'px';
            window.scrollTo(0, 1);
            requestAnimationFrame(function () {
              window.scrollTo(0, 0);
              setTimeout(function () {
                root.style.minHeight = '';
                if (short()) setTimeout(nudge, 200);
              }, 300);
            });
          }
          window.addEventListener('load', nudge);
        })();
      }
    </script>
    <!-- Pre-paint flags for the prerendered landing (style.css / landing.css hide stored-state UI
         under #root[data-ssr] until hydration). ES5, storage may throw. -->
    <script>
      (function () {
        var root = document.documentElement;
        root.setAttribute('data-js', '');
        try {
          if (localStorage.getItem('consent_v1') !== null) root.setAttribute('data-consent-stored', '');
          if (localStorage.getItem('mesaas_promo_dismissed') === '1') {
            root.setAttribute('data-promo-dismissed', '');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/style.css">
    <!-- Crisp: only the $crisp queue and the website id live here. The widget script is injected
         by lib/crispLoader.ts after the visitor consents to the support category. $crisp queues
         calls immediately, so every window.$crisp.push in the app is harmless until then. -->
    <script type="text/javascript">window.$crisp=[];window.CRISP_WEBSITE_ID="bc54b5a7-dc07-46a9-8b6a-1c3ba9923314";</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
