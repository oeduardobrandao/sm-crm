<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Mesaas em manutenção</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #fdfdfd;
        --card: #ffffff;
        --text: #12151a;
        --muted: #4b5563;
        --border: rgba(30, 36, 48, 0.102);
        --accent: #ffbf30;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0c0f;
          --card: #12151a;
          --text: #e8eaf0;
          --muted: #9ca3af;
          --border: #1e2430;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
      }
      .card {
        width: 100%;
        max-width: 440px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px 28px;
        text-align: center;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.04),
          0 8px 24px rgba(0, 0, 0, 0.06);
      }
      .logo {
        height: 22px;
        margin-bottom: 28px;
      }
      .logo-dark {
        display: none;
      }
      @media (prefers-color-scheme: dark) {
        .logo-light {
          display: none;
        }
        .logo-dark {
          display: inline;
        }
      }
      .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        margin-right: 10px;
        vertical-align: middle;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .dot {
          animation: none;
        }
      }
      h1 {
        font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        font-size: 22px;
        line-height: 1.3;
        margin: 0 0 12px;
      }
      p {
        color: var(--muted);
        font-size: 15px;
        line-height: 1.55;
        margin: 0 0 12px;
      }
      .en {
        margin: 20px 0 0;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        font-size: 13px;
      }
      button {
        margin-top: 8px;
        font: inherit;
        font-weight: 600;
        font-size: 15px;
        color: #12151a;
        background: var(--accent);
        border: 0;
        border-radius: 10px;
        padding: 10px 20px;
        cursor: pointer;
      }
      button:hover {
        background: #f5b01f;
      }
      button:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card" role="status">
        <img class="logo logo-light" src="/logo-black.svg" alt="Mesaas" />
        <img class="logo logo-dark" src="/logo-white.svg" alt="Mesaas" />
        <h1><span class="dot" aria-hidden="true"></span>Estamos em manutenção</h1>
        <p>
          Estamos atualizando nossos servidores. O Mesaas volta em alguns minutos e seus dados estão
          seguros.
        </p>
        <p>Esta página tenta de novo sozinha a cada minuto.</p>
        <button type="button" onclick="location.reload()">Tentar agora</button>
        <p class="en">Mesaas is under maintenance and will be back in a few minutes. Your data is safe.</p>
      </div>
    </main>
    <script>
      setInterval(function () {
        location.reload();
      }, 60000);
    </script>
  </body>
</html>
