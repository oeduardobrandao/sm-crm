name: Weekly Changelog

# Generates the public changelog from the week's merged PRs.
#
# No agent: every step is deterministic, trusted code in this repo. The only LLM
# call is a single Groq request (scripts/changelog/write-entries.mjs) that turns
# the selected PRs into entries — it has no shell, no tools, and no repo token.
# Its output is schema-validated by apply.ts and gated by CI before publishing.
#
# Trust split: merged-PR titles/bodies are semi-untrusted, so the only secret
# exposed alongside them is the (free, low-value) GROQ_API_KEY. The push-capable
# PAT (CHANGELOG_PAT) is used ONLY in the final deterministic PR step. The PAT is
# required so the opened PR triggers CI (the auto-merge gate) and the post-merge
# push triggers changelog-notify.yml; a GITHUB_TOKEN-authored PR would trigger neither.

on:
  schedule:
    # Saturdays 09:00 America/Fortaleza (UTC-3, no DST) == 12:00 UTC
    - cron: '0 12 * * 6'
  workflow_dispatch: {} # manual trigger — use for the first validation run

permissions:
  contents: read
  pull-requests: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # generation + two 30-min check watches, with slack
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CHANGELOG_PAT }} # so the later push/PR is PAT-authored

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # 1. Deterministic: list merged PRs + apply the selection filter. Read-only token.
      - name: Select candidate PRs
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx tsx scripts/changelog/fetch.ts > "$RUNNER_TEMP/fetch.json"
          count=$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/fetch.json','utf8')).selected.length))")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Selected $count PR(s) since the last watermark."

      # 2. Groq turns the selected PRs into entries (RUNNER_TEMP/entries.json) —
      #    one call per week of merged PRs, so a multi-week backlog stays under
      #    the free tier's 12k tokens-per-minute cap. No repo token in this step.
      - name: Write entries (Groq)
        if: steps.fetch.outputs.count != '0'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npx tsx scripts/changelog/write-entries.ts "$RUNNER_TEMP/fetch.json" "$RUNNER_TEMP/entries.json"

      # 3. Deterministic: apply (schema-validated) + test-gate + open a PR, wait
      #    for its CI, merge. This is the ONLY place the PAT is exposed.
      #
      #    NOT `gh pr merge --auto`: GitHub auto-merge requires branch protection
      #    rules on main, which this repo doesn't have — the mutation fails with
      #    "Protected branch rules not configured for this branch". We gate on CI
      #    ourselves instead: watch the PR's checks, merge only if they pass.
      - name: Apply, open PR, wait for CI, merge
        if: steps.fetch.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.CHANGELOG_PAT }}
        run: |
          if [ ! -f "$RUNNER_TEMP/entries.json" ]; then
            node -e "const t=process.env.RUNNER_TEMP;const f=JSON.parse(require('fs').readFileSync(t+'/fetch.json','utf8'));require('fs').writeFileSync(t+'/entries.json',JSON.stringify({batchMaxMergedAt:f.batchMaxMergedAt}))"
          fi
          npx tsx scripts/changelog/apply.ts "$RUNNER_TEMP/entries.json"
          npx vitest run apps/crm/src/content/__tests__/changelog.test.ts
          if git diff --quiet -- apps/crm/src/content/changelog.json; then
            echo "No changelog change to publish."
            exit 0
          fi
          branch="chore/changelog-$(date +%F)"
          git config user.name "mesaas-bot"
          git config user.email "alertas@mesaas.com.br"
          git switch -c "$branch"
          git add apps/crm/src/content/changelog.json
          git commit -m "chore(changelog): weekly update"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(changelog): weekly update" \
            --body "Automated weekly changelog."
          sleep 60 # let CI register its check runs on the new PR
          if ! timeout 1800 gh pr checks "$branch" --watch --fail-fast; then
            echo "First watch attempt failed; retrying once (checks may have registered late)."
            sleep 60
            timeout 1800 gh pr checks "$branch" --watch --fail-fast || {
              echo "::error::CI failed on $branch — PR left open for review."
              exit 1
            }
          fi
          gh pr merge --squash --delete-branch "$branch"

      # Failures here went unnoticed for a month once — email on any red run.
      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$ALERT_EMAIL" ]; then
            echo "Missing RESEND_API_KEY/ALERT_EMAIL; skipping alert."
            exit 0
          fi
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "{\"from\":\"Mesaas Alerts <alertas@mesaas.com.br>\",\"to\":[\"$ALERT_EMAIL\"],\"subject\":\"[Mesaas] Weekly Changelog falhou\",\"html\":\"O workflow semanal do changelog falhou. <a href=\\\"$RUN_URL\\\">Ver execucao</a>\"}"
