name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck CRM
        run: npx tsc -p apps/crm/tsconfig.json --noEmit

      - name: Typecheck Hub
        run: npx tsc -p apps/hub/tsconfig.json --noEmit

      - name: Typecheck Admin
        run: npx tsc -p apps/admin/tsconfig.json --noEmit

      - name: Typecheck scripts
        run: npx tsc -p tsconfig.scripts.json

      - name: Typecheck MCP widgets
        run: npx tsc -p apps/mcp-widgets/tsconfig.json --noEmit

      # The mcp function serves the committed bundle; a widget change without the
      # regenerated file would ship the old cards.
      - name: MCP widgets bundle is up to date
        run: npm run build:mcp-widgets && git diff --exit-code supabase/functions/mcp/ui/generated/cards-v1.ts

  # The Vitest suite is ~1000 files and overhead-bound (jsdom + setupFiles + module
  # collect is ~1.6s per file, more than the tests themselves), so it is split across
  # shards. Each shard records its results and raw coverage as a blob; the
  # coverage-threshold job merges them and applies the ratchet floor once.
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Tests with coverage (shard ${{ matrix.shard }}/4)
        run: npx vitest run --shard=${{ matrix.shard }}/4 --coverage --coverage.reporter=json --reporter=blob --reporter=dot

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

  # The landing (`/`) is server-rendered at build time (scripts/seo/prerender.tsx runs a Vite
  # SSR build of apps/crm/src/entry-server.tsx) and hydrated by main.tsx. Nothing else runs the
  # prerender before the Vercel deploy, so a server-render break would only surface there.
  # Placeholder VITE_* values: lib/supabase.ts throws at module load without them, and the
  # render makes no network calls.
  landing-prerender-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build CRM and prerender
        run: npx vite build --config apps/crm/vite.config.ts && npm run prerender

      - name: Assert / is the server-rendered landing
        run: grep -q 'data-ssr="landing"' dist/index.html && grep -q 'lp2-hero' dist/index.html

  e2e:
    # Pinned: ubuntu-latest became Ubuntu 26.04 (runner image 20261025), and the
    # installed @playwright/test 1.59 has no chromium build for it ("Playwright
    # does not support chromium on ubuntu26.04-x64" at browser install).
    # Playwright 1.64 adds ubuntu26.04; unpin when bumping it.
    runs-on: ubuntu-24.04
    needs: [lint-and-typecheck, coverage-threshold]
    timeout-minutes: 15
    env:
      E2E_CRM_EMAIL: ${{ secrets.E2E_CRM_EMAIL }}
      E2E_CRM_PASSWORD: ${{ secrets.E2E_CRM_PASSWORD }}
      E2E_HUB_PATH: ${{ secrets.E2E_HUB_PATH }}
      CRM_BASE_URL: ${{ secrets.CRM_BASE_URL }}
      HUB_BASE_URL: ${{ secrets.HUB_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ env.E2E_CRM_EMAIL != '' }}

      - uses: actions/setup-node@v4
        if: ${{ env.E2E_CRM_EMAIL != '' }}
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        if: ${{ env.E2E_CRM_EMAIL != '' }}

      - name: Install Playwright browsers
        if: ${{ env.E2E_CRM_EMAIL != '' }}
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        if: ${{ env.E2E_CRM_EMAIL != '' }}
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && env.E2E_CRM_EMAIL != '' }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ===========================================================================
  # Backpressure jobs (added 2026-06-03). ADDITIVE ONLY — these do not modify
  # the lint-and-typecheck, unit-tests or e2e jobs above. Each closes a gap where an
  # existing guardrail was not actually gating PRs.
  # ===========================================================================

  # Leak 1: the Deno edge-function test suite ran nowhere automated. This gates
  # the full suite (supabase/functions/) on every PR and push.
  edge-function-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # test:functions runs with --no-check, so this is the only place the edge
      # functions get type-checked. Same --node-modules-dir=auto as the tests so
      # npm: specifiers resolve identically.
      - name: Edge function type-check (deno check)
        run: npm run check:functions

      - name: Edge function tests (Deno)
        run: npm run test:functions

  # Leak 2: the e2e job above skips silently (reporting a false green) when its
  # secrets are absent. This standalone guard surfaces that as a visible,
  # NON-BLOCKING warning annotation — it never fails the build, so the silent
  # skip becomes noticeable without turning CI red. To make it block instead,
  # change the `::warning::` below to `::error::` and add `exit 1`.
  e2e-secrets-guard:
    runs-on: ubuntu-latest
    env:
      E2E_CRM_EMAIL: ${{ secrets.E2E_CRM_EMAIL }}
      E2E_CRM_PASSWORD: ${{ secrets.E2E_CRM_PASSWORD }}
      E2E_HUB_PATH: ${{ secrets.E2E_HUB_PATH }}
      CRM_BASE_URL: ${{ secrets.CRM_BASE_URL }}
      HUB_BASE_URL: ${{ secrets.HUB_BASE_URL }}
    steps:
      - name: Warn if E2E secrets are missing
        run: |
          missing=()
          if [ -z "$E2E_CRM_EMAIL" ]; then missing+=("E2E_CRM_EMAIL"); fi
          if [ -z "$E2E_CRM_PASSWORD" ]; then missing+=("E2E_CRM_PASSWORD"); fi
          if [ -z "$E2E_HUB_PATH" ]; then missing+=("E2E_HUB_PATH"); fi
          if [ -z "$CRM_BASE_URL" ]; then missing+=("CRM_BASE_URL"); fi
          if [ -z "$HUB_BASE_URL" ]; then missing+=("HUB_BASE_URL"); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::warning::E2E secrets missing: ${missing[*]}. The 'e2e' job is skipping silently (false green). Configure them in repo Settings > Secrets to actually run e2e."
          else
            echo "All E2E secrets present — the e2e job will actually run."
          fi

  # Leak 3: coverage was measured but enforced nothing. This merges the
  # unit-tests shards' blobs (re-reporting any failed test) and gates the
  # coverage floor from vitest.coverage.config.ts on the merged result. It used
  # to re-run the whole suite on its own, doubling CI time for the same numbers.
  coverage-threshold:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          path: .vitest-reports
          merge-multiple: true

      - name: Merge shard reports + coverage threshold (ratchet floor)
        run: npx vitest run --merge-reports --coverage --config vitest.coverage.config.ts --reporter=dot

  # Leak 4: prettier format:check was never a CI gate. The whole apps/ and
  # packages/ tree was formatted in this branch, so a full-repo check is now
  # green and is the simplest, strongest gate against future formatting drift.
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Prettier check
        run: npm run format:check

  # Leak 5: two migrations sharing a version prefix (e.g. 20260717000002_a.sql
  # and 20260717000002_b.sql, from parallel PRs) collide in the remote
  # supabase_migrations.schema_migrations table — its primary key is the
  # version, so only the first applies and the second is silently skipped
  # forever (it never reaches prod, and `db push` later blocks on it as an
  # out-of-order migration). This gates against that class of drift by failing
  # the build on any duplicate migration version prefix.
  migration-version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on duplicate migration versions
        run: |
          dupes=$(
            for f in supabase/migrations/*.sql; do
              base=$(basename "$f" .sql)
              echo "${base%%_*}"
            done | sort | uniq -d
          )
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate migration version prefix(es) found:"
            echo "$dupes"
            echo "Rename the newer file(s) to a unique timestamp. Duplicate versions collide in schema_migrations and silently fail to apply to remote databases."
            exit 1
          fi
          echo "No duplicate migration versions."

  # Leak 6: entitlement SQL test suites (supabase/tests/entitlements/) — 20 suites
  # that gate plan limits, feature gates, role isolation, and the P0 workspace
  # selector lockdown. They run against a local Supabase database.
  entitlement-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0

      - name: Start Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,realtime,storage-api,logflare,vector,supavisor,mailpit,postgres-meta

      - name: Run entitlement suites
        run: bash scripts/test-entitlements.sh
