<!doctype html>
<meta charset="utf-8">
<title>Estúdio v2 embed probe — CRM shell simulator</title>
<style>
  body { font-family: sans-serif; margin: 12px }
  iframe { width: 96vw; height: 72vh; border: 2px solid #eab308 }
  pre { background: #f4f4f4; padding: 8px; height: 14vh; overflow: auto; font-size: 11px }
  button { margin: 4px 8px 4px 0 }
</style>
<h3>Estúdio v2 embed probe — host simulates the CRM shell (bridge protocol v1)</h3>
<button id="force-save">Force save (parent → editor)</button>
<span id="status">bridge: waiting for ready…</span>
<iframe id="ed" src=""></iframe>
<pre id="log"></pre>
<script>
  const EDITOR_ORIGIN = 'http://localhost:1420'
  const log = (m) => {
    document.getElementById('log').textContent += m + '\n'
  }
  const frame = document.getElementById('ed')
  frame.src = `${EDITOR_ORIGIN}/?embed=1&docUrl=${encodeURIComponent('http://localhost:3112/doc')}&parentOrigin=${encodeURIComponent(location.origin)}`

  window.addEventListener('message', (e) => {
    if (e.origin !== EDITOR_ORIGIN) return
    const d = e.data
    if (!d || d.v !== 1) return
    log(`editor → ${JSON.stringify(d)}`)
    if (d.type === 'ready' || d.type === 'auth:needed') {
      frame.contentWindow.postMessage({ v: 1, type: 'auth', accessToken: 'dev-token' }, EDITOR_ORIGIN)
      log('parent → auth {accessToken: dev-token}')
    }
    if (d.type === 'doc:loaded') document.getElementById('status').textContent = `bridge: doc loaded rev=${d.rev}`
    if (d.type === 'save:ok') document.getElementById('status').textContent = `bridge: saved rev=${d.rev}`
    if (d.type === 'save:conflict') document.getElementById('status').textContent = 'bridge: CONFLICT — autosave suspended'
  })

  document.getElementById('force-save').onclick = () => {
    frame.contentWindow.postMessage({ v: 1, type: 'save' }, EDITOR_ORIGIN)
    log('parent → save')
  }
</script>
