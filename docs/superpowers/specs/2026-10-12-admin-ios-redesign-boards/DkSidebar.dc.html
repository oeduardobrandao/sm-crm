<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Barra lateral</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/mesaas/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<aside style="box-sizing: border-box; width: 248px; height: {{height}}px; padding: 18px 12px 14px; border-radius: 22px; background: rgba(13,16,22,0.55); backdrop-filter: blur(26px) saturate(1.7); border: 1px solid rgba(255,255,255,0.08); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 12px 40px rgba(0,0,0,0.35); color: #e8eaf0; font-family: var(--font-apple); display: flex; flex-direction: column;">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 18px;">
<svg role="img" aria-label="Mesaas" width="28" height="19" viewBox="0 10 250 171"><path d="M130 100.76H250V163.76C250 173.149 242.389 180.76 233 180.76H130V100.76Z" fill="#FE3452"></path><path d="M0 27.76C0 18.37 7.61 10.76 17 10.76H120V90.76H0V27.76Z" fill="#3984FF"></path><rect y="100.76" width="120" height="80" fill="#FF3F3F"></rect><rect x="130" y="11" width="120" height="80" fill="#6AC9D0"></rect></svg>
<span style="font-family: var(--font-heading); font-size: 17px; font-weight: 700;">Mesaas</span>
<span style="font-size: 10px; font-weight: 600; letter-spacing: 0.12em; color: #9ca3af;">ADMIN</span>
</div>
<nav aria-label="Navegação principal" style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px;">
<sc-for list="{{groups}}" as="group" hint-placeholder-count="4">
<div>
<sc-if value="{{group.label}}" hint-placeholder-val="{{true}}"><h2 style="margin: 0 0 4px 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: #9ca3af;">{{group.label}}</h2></sc-if>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px;">
<sc-for list="{{group.items}}" as="item" hint-placeholder-count="3">
<li><a href="#" aria-current="{{item.current}}" style="{{item.rowStyle}}"><span aria-hidden="true" style="flex-shrink: 0; width: 24px; height: 24px; border-radius: 7px; background: {{item.tile}}; color: #ffffff; display: flex; align-items: center; justify-content: center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{item.d}}"></path></svg></span><span style="flex-grow: 1;">{{item.label}}</span><span style="font-size: 12px; color: #9ca3af;">{{item.count}}</span></a></li>
</sc-for>
</ul>
</div>
</sc-for>
</nav>
<div style="border-top: 1px solid rgba(235,235,245,0.12); padding: 12px 6px 0; display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; align-items: center; gap: 10px;"><span aria-hidden="true" style="flex-shrink: 0; width: 30px; height: 30px; border-radius: 999px; background: #facc15; color: #12151a; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;">EB</span><span style="min-width: 0; flex-grow: 1;"><span style="display: block; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">eduardo@mesaas.com.br</span><span style="display: block; font-size: 11px; color: #9ca3af;">Admin da plataforma</span></span></div>
<div style="display: flex; align-items: center; gap: 8px;"><span id="dk-glass" style="flex-grow: 1; font-size: 13px; color: #c7cad1;">Liquid Glass</span><button type="button" role="switch" aria-checked="true" aria-labelledby="dk-glass" style="position: relative; width: 38px; height: 22px; border: 0; border-radius: 999px; background: #34c759;"><span aria-hidden="true" style="position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 999px; background: #fff;"></span></button><button type="button" style="height: 26px; padding: 0 10px; border-radius: 999px; border: 0; background: rgba(118,118,128,0.24); color: #e8eaf0; font-size: 12px; font-family: inherit;">Sair</button></div>
</div>
</aside>
</x-dc>

}
}
</script>
</body>
</html>
